<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — The Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">

  <div id="loginBox">
    <h2>Admin Login</h2>
    <div id="msg"></div>
  <form class="box" onsubmit="return doAdminLogin(event)">
      <label for="aEmail">Email</label>
      <input id="aEmail" type="email" required>
      <label for="aPass">Password</label>
      <input id="aPass" type="password" required>
      <div style="margin-top:1.2rem;"><button class="btn" type="submit">Log in</button></div>
      
    </form>
  </div>

  <div id="dashBox" style="display:none;">
    <h2>Admin Dashboard</h2>
    <div class="stats" id="stats"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));">
      <div class="card">
        <h3>Manage Rooms</h3>
        <p class="muted">Add rooms, edit rent, toggle availability.</p>
        <a class="btn" href="manage-rooms.html">Open</a>
      </div>
      <div class="card">
        <h3>Manage Bookings</h3>
        <p class="muted">Review and confirm booking requests.</p>
        <a class="btn" href="manage-bookings.html">Open</a>
      </div>
    </div>
  </div>

</main>
<footer><div class="container">The Register — Room Rent Booking</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
renderNav('admin');

function showMsg(text, type){
  document.getElementById('msg').innerHTML =
    `<div class="msg ${type}">${esc(text)}</div>`;
}

async function doAdminLogin(e){
  e.preventDefault();

  const email = document.getElementById('aEmail').value.trim();
  const password = document.getElementById('aPass').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    showMsg('Incorrect email or password.', 'error');
    return false;
  }

  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashBox').style.display = 'block';

  loadDashboard();

  return false;
}

async function loadDashboard(){
  const { data: { user } } = await supabaseClient.auth.getUser();

  if (!user) {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('dashBox').style.display = 'none';
    return;
  }

  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashBox').style.display = 'block';

  const rooms = getRooms();
  const bookings = getBookings();

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${rooms.length}</div><div class="l">Total rooms</div></div>
    <div class="stat"><div class="n">${rooms.filter(r=>r.available).length}</div><div class="l">Available now</div></div>
    <div class="stat"><div class="n">${bookings.length}</div><div class="l">Total bookings</div></div>
    <div class="stat"><div class="n">${bookings.filter(b=>b.status==='pending').length}</div><div class="l">Pending requests</div></div>
  `;
}

loadDashboard();
</script>
</body>
</html>
